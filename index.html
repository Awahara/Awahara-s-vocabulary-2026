<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e9">
  <title>挖空记词 · IELTS 语境填空</title>
  <meta name="description" content="用英文句子挖空的方式记雅思词汇：看语境选单词，按记忆曲线自动安排复习。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f6f5e'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%23fffdf8' text-anchor='middle'%3EAa%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">Aa</div>
        <div class="brand-text">
          <h1>挖空记词</h1>
          <p id="brand-sub">IELTS 语境填空</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="streak" id="streak" title="本轮连续答对"><span aria-hidden="true">🔥</span><b>0</b></span>
        <button type="button" class="icon-btn" id="toggle-sound" aria-pressed="true" title="音效">🔔</button>
        <button type="button" class="icon-btn" id="toggle-speak" aria-pressed="false" title="答对后自动朗读">🤐</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="页面切换">
      <button type="button" class="tab is-active" data-view="practice" role="tab" aria-selected="true">练习</button>
      <button type="button" class="tab" data-view="stats" role="tab" aria-selected="false">进度</button>
      <button type="button" class="tab" data-view="library" role="tab" aria-selected="false">词库</button>
    </nav>

    <main>
      <section id="view-practice" class="view">
        <div class="toolbar">
          <div class="modes" id="modes" role="tablist" aria-label="练习模式">
            <button type="button" class="mode is-active" data-mode="review" role="tab" aria-selected="true">今日复习</button>
            <button type="button" class="mode" data-mode="random" role="tab" aria-selected="false">随机练</button>
            <button type="button" class="mode" data-mode="wrong" role="tab" aria-selected="false">错词本</button>
          </div>
          <label class="topic-picker">
            <span>主题</span>
            <select id="topic"><option value="">全部词库</option></select>
          </label>
        </div>
        <div class="session-meta" id="session-meta"></div>
        <div id="card-host"></div>
      </section>

      <section id="view-stats" class="view" hidden></section>
      <section id="view-library" class="view" hidden></section>
    </main>

    <footer class="foot">
      键盘 <kbd>1</kbd>–<kbd>4</kbd> 选择 · <kbd>Enter</kbd> 下一题 · 学习进度只保存在本机浏览器
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
